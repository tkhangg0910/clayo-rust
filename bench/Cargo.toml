[package]
name = "clayo-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: not part of the clayo workspace, so it never ships in clayo.exe.
[workspace]

[dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp"] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"
